# Config for the demo run on the fake dataset (data/demo/raw). Same keys as config.yaml.
# All demo outputs go under exp/demo/ so they never mix with real results.
paths:
  raw: data/demo/raw
  interim: exp/demo/work/interim
  processed: exp/demo/work/processed
  results: exp/demo/results

official_labeler_did: did:plc:ar7c4by46qjdydhdevvrndac

windows:
  feature_start: "2026-04-01"
  feature_end:   "2026-04-30"
  outcome_end:   "2026-07-01"

blocking:
  k_main: 5
  k_sensitivity: [1, 20]
  alert_days: [1, 3, 7]
  horizon_days: 30

toxicity:
  model: multilingual
  max_posts_per_account: 50

duckdb:
  memory_limit: 4GB
  threads: 4
  temp_dir: exp/demo/work/interim/duckdb_tmp

seed: 42
